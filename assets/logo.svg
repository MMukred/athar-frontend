<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="atharGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB" />
      <stop offset="100%" stop-color="#094CB5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#2DA44E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1F6FEB" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Shield / Hexagon -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#atharGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner geometric ring -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Stylized Impact / Hand / Ripple Leaf (Athar - Mark of Impact) -->
  <g transform="translate(80, 80)">
    <!-- Central growing sprout & handshake curves -->
    <path d="M0 -34 C16 -18 28 6 18 28 C10 40 -10 40 -18 28 C-28 6 -16 -18 0 -34 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M0 -18 C10 -6 18 12 10 24 C4 32 -4 32 -10 24 C-18 12 -10 -6 0 -18 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-38" r="7" fill="#FFFFFF"/>
    
    <!-- Radiating impact ripples -->
    <path d="M-30 -10 C-40 4 -36 24 -24 34" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M30 -10 C40 4 36 24 24 34" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <circle cx="-32" cy="-14" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="32" cy="-14" r="3.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
