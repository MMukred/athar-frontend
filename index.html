<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أثر | نظام إدارة المتطوعين واللجان - Athar Management System</title>
  <meta name="description"
    content="نظام مركزي لإدارة المتطوعين، اللجان، الاجتماعات، التقييمات، الساعات التطوعية، والشهادات التقديرية ثنائي اللغة">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Apply saved theme before first paint (prevents flash) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("athar_theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rtl.css">
</head>

<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen" style="display:none;">
    <div class="login-card">
      <div class="login-header">
        <img src="assets/logo.svg" alt="Athar Logo" class="login-logo">
        <h1 class="login-title" id="login-title">أثر</h1>
        <p class="login-subtitle" id="login-subtitle">نظام إدارة المتطوعين واللجان</p>
      </div>

      <form id="login-form" class="login-form" autocomplete="on">
        <div class="login-field">
          <label for="login-email" id="login-email-label">البريد الإلكتروني</label>
          <input type="email" id="login-email" required autocomplete="username" dir="ltr">
        </div>

        <div class="login-field">
          <label for="login-password" id="login-password-label">كلمة المرور</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" required autocomplete="current-password" dir="ltr">
            <button type="button" class="password-toggle" id="password-toggle"
              aria-label="Show password" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="login-row">
          <label class="login-remember">
            <input type="checkbox" id="login-remember">
            <span id="login-remember-label">تذكرني</span>
          </label>
        </div>

        <div id="login-error" class="login-error" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-lg login-submit" id="login-submit-btn">
          تسجيل الدخول
        </button>
      </form>

      <div class="login-footer">
        <button type="button" id="login-theme-toggle" class="lang-toggle-btn theme-toggle-btn"
          title="تبديل المظهر / Toggle Theme" aria-label="Toggle theme">
          <svg class="theme-icon theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
        <button type="button" id="login-lang-toggle" class="lang-toggle-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="login-lang-text">English</span>
        </button>
        <a href="apply.html" id="login-apply-link" class="login-apply-link">تقدّم للتطوع ←</a>
        <a href="#public-verify" id="login-verify-link" class="login-apply-link">التحقق من شهادة ←</a>
      </div>
    </div>
  </div>

  <div id="app" role="application" aria-label="Athar Management System">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="Toggle Sidebar" aria-label="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="brand-container" id="brand-home-btn">
          <img src="assets/logo.svg" alt="Athar Logo" class="brand-logo">
          <div class="brand-text">
            <span class="brand-name">
              <span id="txt-app-name">أثر</span>
            </span>
            <span class="brand-subname" id="txt-app-subname">نظام إدارة المتطوعين واللجان</span>
          </div>
        </div>
      </div>

      <!-- Global Search -->
      <div class="top-bar-search">
        <div class="search-input-wrapper">
          <span class="search-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" id="global-search-input" class="search-input"
            placeholder="بحث عن متطوعين، لجان، اجتماعات..." autocomplete="off">
          <span class="search-kbd">Ctrl+K</span>
          <div class="search-results" id="global-search-results" hidden></div>
        </div>
      </div>

      <!-- Top Bar Actions -->
      <div class="top-bar-right">
        <!-- Mobile search (visible on small screens only) -->
        <button id="mobile-search-btn" class="lang-toggle-btn mobile-search-btn" title="بحث / Search"
          aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="lang-toggle-btn theme-toggle-btn"
          title="تبديل المظهر / Toggle Theme" aria-label="Toggle theme">
          <svg class="theme-icon theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <svg class="theme-icon theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>

        <!-- Bilingual Toggle -->
        <button id="lang-toggle-btn" class="lang-toggle-btn" title="تبديل اللغة / Toggle Language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="lang-toggle-text">English</span>
        </button>

<!-- Quick Add -->
        <div class="quick-add-wrap" id="quick-add-wrap" style="position:relative;">
          <button id="quick-add-btn" class="lang-toggle-btn" title="Quick add / إضافة سريعة" aria-label="Quick add" style="display:flex; align-items:center; justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div id="quick-add-menu" class="quick-add-menu" hidden></div>
        </div>

        <!-- User Menu -->
        <div class="user-menu-btn" id="user-profile-btn">
          <div class="user-avatar" id="user-avatar-badge">M</div>
          <span class="user-name-text" id="user-display-name">محمد (Super Admin)</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </header>

    <!-- Mobile global search panel (≤620px) -->
    <div id="mobile-search-panel" class="mobile-search-panel" hidden>
      <input type="text" id="mobile-search-input" class="search-input"
        placeholder="بحث عن متطوعين، لجان، اجتماعات..." autocomplete="off">
      <div class="search-results" id="mobile-search-results" hidden></div>
    </div>

    <!-- Main Shell -->
    <div class="main-layout">
      <aside class="sidebar" id="app-sidebar" role="navigation" aria-label="Main navigation">
        <nav class="sidebar-nav" id="sidebar-nav-container">
          <!-- Dynamically populated -->
        </nav>
        <div class="sidebar-footer">
          <div class="org-name-text" style="font-size:11px; color:var(--neutral-500); text-align:center;">
            مؤسسة أثر للعمل المجتمعي &bull; 2026
          </div>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

      <main class="content-area" id="main-content" role="main" aria-live="polite">
        <!-- Injected dynamically by app.js router -->
      </main>
    </div>

    <!-- Modals & Slide-over Containers -->
    <div id="modal-container"></div>
    <div id="slideover-container"></div>
    <div id="toast-container"></div>
    <button id="scroll-top-btn" class="scroll-top-btn" aria-label="Scroll to top" title="Top">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
  </div>

  <!-- Application Logic & Utilities -->
  <script src="js/translations.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils/qr.js"></script>
  <script src="js/utils/diff.js"></script>
  <script src="js/utils/export.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/search.js"></script>

  <!-- Views -->
  <script src="js/views/index.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/volunteers.js"></script>
  <script src="js/views/committees.js"></script>
  <script src="js/views/meetings.js"></script>
  <script src="js/views/evaluations.js"></script>
  <script src="js/views/hours.js"></script>
  <script src="js/views/certificates.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/whatsapp.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/views/audit.js"></script>
  <script src="js/views/settings.js"></script>

  <script src="js/app.js"></script>
  <script src="js/criteria-modal.js"></script>
</body>

</html>
